<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Gira y Detecta · Ciberseguridad CIIECOM UP</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2.5 20 5.5v6.7c0 4.8-3.4 8.3-8 9.8-4.6-1.5-8-5-8-9.8V5.5z' fill='%232D8CFF'/%3E%3Cpath d='m8.6 12.2 2.3 2.4 4.5-4.7' fill='none' stroke='%23ffffff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0A1428;
    --panel:#12213F;
    --panel-2:#1A2D54;
    --blue:#2D8CFF;
    --cyan:#6FD3FF;
    --text:#FFFFFF;
    --text-2:#B8C7E0;
    --ok:#2ECC71;
    --bad:#FF4D4D;
    --warn:#FFC83D;
  }

  *{ box-sizing:border-box; }

  html, body{
    margin:0; padding:0; width:100%; height:100%;
    overflow:hidden; background:#04070d; color:var(--text);
    font-family:"Segoe UI", Arial, Helvetica, sans-serif;
    -webkit-user-select:none; user-select:none;
    cursor:default;
  }

  body.nocursor{ cursor:none; }

  /* Lienzo fijo 1920x1080 escalado a la ventana */
  #stage{
    position:absolute; left:50%; top:50%;
    width:1920px; height:1080px;
    transform-origin:50% 50%;
    transform:translate(-50%,-50%) scale(1);
    overflow:hidden;
    display:flex; flex-direction:column;
    background:radial-gradient(ellipse at 50% 0%, #0f2144 0%, var(--bg) 55%, #060d1c 100%);
    box-shadow:0 0 80px rgba(0,0,0,.85);
  }

  #stage::before{
    content:""; position:absolute; inset:0; z-index:0; pointer-events:none;
    background-image:
      linear-gradient(rgba(111,211,255,.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(111,211,255,.055) 1px, transparent 1px);
    background-size:64px 64px;
  }

  .bg-shield{
    position:absolute; left:50%; top:52%; width:760px; height:760px;
    transform:translate(-50%,-50%); color:var(--cyan); opacity:.05;
    pointer-events:none; z-index:0;
  }

  /* Cabecera y pie */
  header{
    flex:0 0 110px; display:flex; align-items:center; justify-content:space-between;
    padding:0 56px; border-bottom:2px solid rgba(111,211,255,.16);
    position:relative; z-index:3;
  }
  .brand{ display:flex; align-items:center; gap:20px; }
  .brand svg{ width:62px; height:62px; color:var(--cyan); }
  .brand .t1{ font-size:40px; font-weight:800; letter-spacing:3px; }

  main{ position:relative; flex:1 1 auto; min-height:0; z-index:2; overflow:hidden; }

  #stage.hacked header{ display:none; }
  #stage.hacked main{ z-index:9; }

  /* Pantallas */
  .screen{ position:absolute; inset:0; display:none; padding:26px 56px 10px; }
  .screen.active{ display:flex; flex-direction:column; }

  /* ---------- Pantalla de la ruleta ---------- */
  #screen-wheel.active{
    display:grid; grid-template-columns:1fr 1fr; align-items:center;
    padding:6px 64px;
  }
  .wheel-side{ display:flex; align-items:center; justify-content:center; height:100%; }
  .wheel-wrap{ position:relative; width:780px; height:780px; }

  .pointer{
    position:absolute; left:50%; top:-26px; transform:translateX(-50%);
    width:0; height:0;
    border-left:28px solid transparent; border-right:28px solid transparent;
    border-top:50px solid #ffffff;
    filter:drop-shadow(0 8px 12px rgba(0,0,0,.7));
    z-index:6;
  }

  .wheel{
    position:absolute; inset:0; border-radius:50%;
    border:10px solid rgba(111,211,255,.55);
    box-shadow:0 0 70px rgba(45,140,255,.45), inset 0 0 70px rgba(0,0,0,.55);
    will-change:transform;
  }

  .lbl{ position:absolute; inset:0; display:flex; justify-content:center; pointer-events:none; }
  .lbl-in{
    padding-top:30px; width:250px; text-align:center;
    font-size:26px; font-weight:800; line-height:1.12;
    text-transform:uppercase; letter-spacing:.5px;
    text-shadow:0 2px 8px rgba(0,0,0,.75);
  }
  .lbl-in svg{ width:46px; height:46px; display:block; margin:0 auto 8px; }

  .hub{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:220px; height:220px; border-radius:50%;
    border:6px solid var(--cyan);
    background:radial-gradient(circle at 50% 32%, #1d3f74, #0b1a33);
    color:#fff; font-family:inherit; font-size:44px; font-weight:800; letter-spacing:2px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; z-index:5;
    box-shadow:0 0 44px rgba(45,140,255,.6);
    transition:box-shadow .2s, transform .12s;
  }
  .hub:hover{ box-shadow:0 0 70px rgba(111,211,255,.85); transform:translate(-50%,-50%) scale(1.04); }
  .hub:active{ transform:translate(-50%,-50%) scale(.97); }

  .wheel-text{ padding-right:20px; }
  .wheel-text h1{
    margin:0 0 8px; font-size:86px; line-height:1.02;
    font-weight:800; text-transform:uppercase; letter-spacing:1px;
  }
  .wheel-text h1 .accent{ color:var(--cyan); }
  .wheel-text .sub{
    margin:26px 0 40px; font-size:54px; font-weight:600; color:var(--text-2);
  }
  .wheel-text .big-btn{ font-size:52px; min-width:520px; }

  /* Revelación de casilla */
  .reveal{
    position:absolute; inset:0; z-index:20;
    background:rgba(6,13,28,.9);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:26px;
    opacity:0; pointer-events:none; transition:opacity .25s;
  }
  .reveal.show{ opacity:1; }
  .reveal svg{ width:160px; height:160px; }
  .reveal .name{ font-size:110px; font-weight:800; text-align:center; letter-spacing:.5px; }

  /* ---------- Cabecera de reto ---------- */
  .ch-head{ display:flex; align-items:center; gap:24px; flex:0 0 auto; padding:10px 0 16px; }
  .ch-icon{ width:74px; height:74px; color:var(--cyan); flex:0 0 auto; }
  .ch-icon svg{ width:100%; height:100%; }
  .ch-title{ font-size:46px; font-weight:800; letter-spacing:1px; }
  .round-tag{
    margin-left:auto; font-size:28px; font-weight:700;
    letter-spacing:2px; color:var(--text-2); text-transform:uppercase;
  }
  .round-tag b{ color:var(--cyan); }

  .timer{ margin-left:auto; display:flex; align-items:center; gap:20px; width:560px; }
  .timer-bar{
    flex:1 1 auto; height:18px; border-radius:10px; overflow:hidden;
    background:rgba(255,255,255,.14);
  }
  .timer-fill{ height:100%; width:100%; border-radius:10px; background:var(--blue); }
  .timer.warn .timer-fill{ background:var(--warn); }
  .timer.danger .timer-fill{ background:var(--bad); }
  .timer-num{
    width:96px; text-align:right; font-size:48px; font-weight:700;
    font-variant-numeric:tabular-nums;
  }
  .timer.warn .timer-num{ color:var(--warn); }
  .timer.danger .timer-num{ color:var(--bad); }

  .ch-body{
    flex:1 1 auto; min-height:0;
    display:flex; flex-direction:column; justify-content:center; gap:28px;
    padding-bottom:8px;
  }

  /* ---------- Tarjeta de mensaje ---------- */
  .msg{
    width:100%; max-width:1340px; margin:0 auto;
    border:3px solid rgba(111,211,255,.35); border-radius:26px;
    background:var(--panel); overflow:hidden; position:relative;
    box-shadow:0 0 28px rgba(45,140,255,.22);
  }
  .msg-wrap{ position:relative; width:100%; max-width:1340px; margin:0 auto; }
  .msg-wrap .msg{ max-width:none; }
  .msg.suspicious{ border-color:rgba(255,77,77,.75); box-shadow:0 0 30px rgba(255,77,77,.3); }
  .msg-head{ background:var(--panel-2); padding:16px 30px; display:flex; flex-direction:column; gap:8px; }
  .msg-line{ display:flex; gap:18px; font-size:34px; align-items:baseline; }
  .msg-line .k{ color:var(--text-2); min-width:130px; font-size:28px; text-transform:uppercase; letter-spacing:1px; }
  .chip{
    display:inline-block; align-self:flex-start;
    font-size:26px; letter-spacing:1px; text-transform:uppercase; color:var(--cyan);
    background:rgba(111,211,255,.1); border:1px solid rgba(111,211,255,.3);
    border-radius:999px; padding:6px 22px;
  }
  .msg-body{ padding:26px 36px; font-size:40px; line-height:1.4; }
  .msg-body.bubble{ font-size:38px; }

  /* Zonas clicables del correo */
  .zones{ padding:14px 18px; display:flex; flex-direction:column; }
  .zone{
    display:flex; align-items:center; gap:22px; width:100%;
    min-height:92px; padding:12px 18px;
    background:transparent; border:0; border-left:6px solid transparent;
    border-radius:14px; color:var(--text); font-family:inherit;
    font-size:36px; text-align:left; cursor:pointer;
    transition:background .15s, border-color .15s;
  }
  .zone:hover{ background:rgba(45,140,255,.18); border-left-color:var(--cyan); }
  .zone .zk{
    flex:0 0 150px; font-size:26px; letter-spacing:1px;
    text-transform:uppercase; color:var(--text-2);
  }
  .zone .zt{ flex:1 1 auto; }
  .zone.is-senal{ background:rgba(255,77,77,.12); border-left-color:var(--bad); }
  .zone.picked-ok{ background:rgba(46,204,113,.18); border-left-color:var(--ok); }
  .zone.picked-bad{ background:rgba(255,77,77,.22); border-left-color:var(--bad); }
  .zone:disabled{ cursor:default; }

  /* Versión compacta del correo en la pantalla de resultado */
  .msg.compact .zone{ min-height:68px; font-size:30px; }
  .msg.compact .zone .zk{ flex-basis:110px; font-size:22px; }
  .res-grid{ display:grid; grid-template-columns:1.55fr 1fr; gap:36px; align-items:center; }
  #screen-result .ch-body{ gap:16px; }
  #screen-result .situation{ font-size:38px; padding:20px 30px; }
  #screen-result .situation svg{ width:86px; height:86px; }
  #screen-result .definition{ padding:18px 30px; }
  #screen-result .definition h2{ font-size:42px; }
  #screen-result .definition p{ font-size:27px; }
  #screen-result .signals{ align-self:center; }

  /* Resumen compacto de «¿Qué harías?» en el resultado */
  .q-summary{
    max-width:1560px; margin:0 auto; text-align:center;
    font-size:30px; line-height:1.3; color:var(--text-2);
  }
  #screen-result .q-line{
    max-width:1460px; margin:0 auto;
    font-size:29px; line-height:1.35; color:var(--text-2);
  }
  #screen-result .q-line b{ color:var(--text); }
  #screen-result .answers .btn{ font-size:34px; padding:0 24px; }

  /* Ajustes para que el resultado quepa siempre sin recortes */
  #screen-result .ch-head{ padding:2px 0 10px; }
  #screen-result .ch-icon{ width:58px; height:58px; }
  #screen-result .ch-title{ font-size:40px; }
  #screen-result .banner{ min-height:92px; font-size:46px; }
  #screen-result .banner svg{ width:52px; height:52px; }
  #screen-result .pcard{ min-height:274px; }
  #screen-result .explain{ font-size:32px; }
  #screen-result .btn{ min-height:100px; font-size:40px; }
  #screen-result .btn svg{ width:46px; height:46px; }
  #screen-result .answers .btn{ min-height:104px; min-width:400px; }
  #screen-result .signals .sig{ font-size:30px; }
  #screen-result .phrase.big{ font-size:60px; }

  /* ---------- Botones ---------- */
  .btn{
    min-height:120px; min-width:420px; padding:0 44px;
    border-radius:26px; border:3px solid var(--blue);
    background:rgba(45,140,255,.14); color:#fff;
    font-family:inherit; font-size:46px; font-weight:800; letter-spacing:.5px;
    display:inline-flex; align-items:center; justify-content:center; gap:18px;
    cursor:pointer; transition:background .16s, box-shadow .16s, transform .1s;
  }
  .btn svg{ width:56px; height:56px; }
  .btn:hover{ background:rgba(45,140,255,.3); box-shadow:0 0 26px rgba(45,140,255,.5); }
  .btn:active{ transform:translateY(3px); }
  .btn:disabled{ opacity:.4; cursor:default; }

  .btn.bad{ border-color:var(--bad); background:rgba(255,77,77,.14); }
  .btn.bad:hover{ background:rgba(255,77,77,.28); box-shadow:0 0 26px rgba(255,77,77,.45); }
  .btn.solid{ background:var(--blue); }
  .btn.solid:hover{ background:#4a9dff; }
  .btn.ok{ border-color:var(--ok); background:rgba(46,204,113,.18); }
  .btn.ok:hover{ background:rgba(46,204,113,.3); box-shadow:0 0 26px rgba(46,204,113,.45); }

  .answers{ display:flex; justify-content:center; gap:48px; flex-wrap:wrap; }
  .answers .btn{ min-width:480px; min-height:140px; }
  .answers.three{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:32px;
    width:100%; max-width:1720px; margin:0 auto;
  }
  .answers.three .btn{ min-width:0; width:100%; font-size:42px; padding:0 20px; }

  /* ---------- Contraseñas ---------- */
  .pcards{ display:grid; grid-template-columns:repeat(3,1fr); gap:44px; padding:0 30px; }
  .pcard{
    min-height:380px; padding:26px 22px;
    border-radius:28px; border:3px solid rgba(111,211,255,.45);
    background:var(--panel); color:#fff; font-family:inherit;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
    cursor:pointer; transition:border-color .16s, box-shadow .16s, transform .1s;
  }
  .pcard:hover{ border-color:var(--cyan); box-shadow:0 0 34px rgba(45,140,255,.5); }
  .pcard:active{ transform:translateY(3px); }
  .pcard:disabled{ cursor:default; }
  .pcard .letter{ font-size:32px; font-weight:700; color:var(--text-2); letter-spacing:2px; }
  .pcard svg{ width:54px; height:54px; color:var(--cyan); }
  .pcard .pass{
    font-family:Consolas, "Courier New", monospace;
    font-size:46px; font-weight:700; line-height:1.2;
    word-break:break-word; text-align:center;
  }
  .pcard.right{ border-color:var(--ok); box-shadow:0 0 34px rgba(46,204,113,.45); }
  .pcard.wrong{ border-color:var(--bad); box-shadow:0 0 34px rgba(255,77,77,.4); }
  .pcard .tag{ font-size:28px; font-weight:700; color:var(--ok); }
  .pcard .tag.bad{ color:var(--bad); }  .strength{ width:100%; height:16px; border-radius:8px; background:rgba(255,255,255,.15); overflow:hidden; }
  .strength i{ display:block; height:100%; border-radius:8px; }
  .strength i.s-bad{ background:var(--bad); }
  .strength i.s-warn{ background:var(--warn); }
  .strength i.s-ok{ background:var(--ok); }
  .ptime{ font-size:28px; color:var(--text-2); text-align:center; }
  .ptime b{ color:var(--text); font-size:30px; display:block; }
  .hintline{ text-align:center; font-size:44px; font-weight:600; color:var(--text-2); }

  /* ---------- Verdadero o falso / situación ---------- */
  .phrase{
    max-width:1500px; margin:0 auto; text-align:center;
    font-size:64px; line-height:1.28; font-weight:600;
    padding:34px 44px;
  }
  .phrase.big{ font-size:70px; }
  .situation{
    max-width:1420px; margin:0 auto;
    display:flex; align-items:center; gap:32px;
    background:var(--panel); border:3px solid rgba(111,211,255,.35);
    border-radius:26px; padding:24px 36px;
    font-size:46px; line-height:1.3;
  }
  .situation svg{ width:120px; height:120px; flex:0 0 auto; color:var(--cyan); }

  /* ---------- Resultado ---------- */
  .banner{
    display:flex; align-items:center; gap:24px;
    min-height:110px; padding:0 34px; border-radius:22px;
    font-size:54px; font-weight:800;
  }
  .banner svg{ width:64px; height:64px; }
  .banner.ok{ background:rgba(46,204,113,.16); border:3px solid var(--ok); color:#8CF3B4; }
  .banner.bad{ background:rgba(255,77,77,.14); border:3px solid var(--bad); color:#FFB3B3; }
  .banner.warn{ background:rgba(255,200,61,.14); border:3px solid var(--warn); color:#FFE1A0; }

  .signals{ display:flex; flex-direction:column; gap:12px; max-width:1340px; margin:0 auto; width:100%; }
  .sig{ display:flex; gap:18px; align-items:flex-start; font-size:32px; color:var(--text-2); line-height:1.3; }
  .sig .n{
    flex:0 0 44px; height:44px; border-radius:50%;
    background:var(--bad); color:#fff; font-weight:800;
    display:flex; align-items:center; justify-content:center; font-size:26px;
  }
  .sig.real .n{ background:var(--ok); }

  .explain{
    max-width:1300px; margin:0 auto; width:100%;
    font-size:38px; line-height:1.35; color:var(--text-2);
  }
  .explain b{ color:var(--text); }
  .actions{ display:flex; justify-content:flex-end; padding-top:4px; }

  .definition{
    max-width:1200px; margin:0 auto; width:100%;
    background:var(--panel); border:3px solid var(--blue); border-radius:24px;
    padding:26px 36px;
  }
  .definition h2{ margin:0 0 8px; font-size:52px; }
  .definition p{ margin:0 0 10px; font-size:32px; color:var(--text-2); line-height:1.35; }
  .definition .prot{ color:var(--cyan); }

  /* ---------- Premio ---------- */
  #screen-prize.active{ align-items:center; justify-content:center; text-align:center; }
  .prize{ display:flex; flex-direction:column; align-items:center; gap:36px; width:100%; max-width:1500px; }
  .prize-icon{ width:160px; height:160px; color:var(--ok); }
  .prize-icon svg{ width:100%; height:100%; }
  .prize h2{ margin:0; font-size:72px; font-weight:800; line-height:1.12; }
  .prize p.sub{ margin:0; font-size:40px; color:var(--cyan); font-weight:700; }
  .tip{
    max-width:1300px; width:100%; margin:0;
    background:rgba(45,140,255,.12); border:3px solid rgba(111,211,255,.45);
    border-radius:24px; padding:26px 40px;
    font-size:40px; line-height:1.3;
  }
  .tip .lbl2{ display:block; font-size:26px; letter-spacing:2px; text-transform:uppercase; color:var(--cyan); margin-bottom:10px; }
  .extra{ font-size:38px; font-weight:800; color:var(--ok); min-height:48px; }

  /* ---------- ¡Hackeado! ---------- */
  #screen-hack{ padding:0; }
  #screen-hack.active{ display:flex; flex-direction:column; }
  .hack-a, .hack-c{
    flex:1 1 auto; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:34px; text-align:center;
  }
  .hack-a{ background:#0A0A0A; color:var(--bad); font-family:Consolas, "Courier New", monospace; }
  .hack-a h1{ margin:0; font-size:78px; font-weight:800; letter-spacing:2px; animation:blink 1s steps(1) infinite; }
  .hack-a .sub{ font-size:44px; color:#FF9C9C; }
  .hack-a.shake{ animation:shake .28s linear 4; }
  @keyframes blink{ 50%{ opacity:.72; } }
  @keyframes shake{
    0%{ transform:translateX(0); } 25%{ transform:translateX(-9px); }
    50%{ transform:translateX(9px); } 75%{ transform:translateX(-5px); }
    100%{ transform:translateX(0); }
  }
  .hack-c{ background:var(--bg); padding:0 90px 30px; gap:24px; }
  .hack-c h2{ margin:0; font-size:58px; }
  .hack-c .atk{ font-size:76px; font-weight:800; color:var(--bad); margin:0; }
  .hack-c .intro{ font-size:32px; color:var(--text-2); margin:0; max-width:1300px; }
  .tips{ display:flex; gap:26px; max-width:1560px; width:100%; }
  .tip-card{
    flex:1 1 0; background:var(--panel); border:3px solid rgba(111,211,255,.35);
    border-radius:22px; padding:24px 22px; display:flex; flex-direction:column;
    align-items:center; gap:14px; font-size:30px; line-height:1.3;
  }
  .tip-card .n{
    width:52px; height:52px; border-radius:50%; background:var(--blue);
    color:#fff; font-size:28px; font-weight:800;
    display:flex; align-items:center; justify-content:center;
  }

  /* ---------- Panel del operador ---------- */
  #operator{
    position:fixed; right:18px; top:18px; z-index:100;
    display:none; width:330px; padding:18px 22px;
    background:rgba(10,20,40,.96); border:2px solid var(--cyan);
    border-radius:16px; color:#fff; font-family:Consolas, "Courier New", monospace;
    box-shadow:0 10px 30px rgba(0,0,0,.6);
  }
  #operator.show{ display:block; }
  #operator h3{ margin:0 0 10px; font-size:18px; letter-spacing:1px; color:var(--cyan); }
  #operator .row{ display:flex; justify-content:space-between; font-size:20px; padding:3px 0; }
  #operator button{
    margin-top:10px; width:100%; padding:8px; font-size:16px; cursor:pointer;
    background:rgba(255,77,77,.15); color:#fff; border:1px solid var(--bad); border-radius:8px;
  }
  #operator .hint{ margin-top:8px; font-size:13px; color:var(--text-2); line-height:1.4; }

  /* ---------- Error ---------- */
  #fatal{
    position:fixed; inset:0; z-index:999; display:none;
    background:#0A1428; color:#fff; align-items:center; justify-content:center;
    font-size:64px; font-weight:800; text-align:center; padding:40px;
  }
  #fatal.show{ display:flex; }

  /* ============================================================
     Movimiento, foco y microinteracciones
     ============================================================ */
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(16px); } to{ opacity:1; transform:translateY(0); } }
  @keyframes floaty{ 0%,100%{ transform:translate(-50%,-50%) translateY(0); } 50%{ transform:translate(-50%,-50%) translateY(-16px); } }

  @keyframes wrapGlow{ 0%,100%{ filter:drop-shadow(0 0 12px rgba(45,140,255,.2)); } 50%{ filter:drop-shadow(0 0 34px rgba(45,140,255,.5)); } }
  @keyframes popIn{ 0%{ opacity:0; transform:scale(.86);} 100%{ opacity:1; transform:scale(1);} }
  @keyframes stampIn{ 0%{ opacity:0; transform:rotate(-18deg) scale(2.6);} 60%{ opacity:1; transform:rotate(-12deg) scale(.95);} 100%{ opacity:1; transform:rotate(-12deg) scale(1);} }

  .hub{ animation:hubGlow 3.4s ease-in-out infinite; }
  .wheel{ transition:filter .25s; }
  .wheel-wrap:hover .wheel{ filter:brightness(1.05); }

  .brand svg{ transition:transform .3s ease; }
  .brand:hover svg{ transform:rotate(-6deg) scale(1.06); }

  .btn{ transition:background .16s, box-shadow .16s, transform .12s, border-color .16s; }
  .btn:hover{ transform:translateY(-3px); }
  .btn:active{ transform:translateY(2px) scale(.99); }

  .pcard svg{ transition:transform .22s ease, color .22s; }
  .pcard:hover svg{ transform:scale(1.1) rotate(-5deg); color:var(--cyan); }
  .pcard:hover{ transform:translateY(-6px); }

  .zone{ transition:background .16s, border-color .16s, transform .18s; }
  .zone:hover{ transform:translateX(6px); }

  .situation{ transition:border-color .2s, box-shadow .2s; }
  .situation:hover{ border-color:var(--cyan); box-shadow:0 0 26px rgba(45,140,255,.28); }

  .definition:hover{ border-color:var(--cyan); box-shadow:0 0 26px rgba(45,140,255,.25); }

  .tip-card:hover{ transform:translateY(-5px); border-color:var(--cyan); box-shadow:0 0 24px rgba(45,140,255,.3); }

  .stamp{
    position:absolute; right:-14px; top:-10px; z-index:3;
    padding:4px 20px; border:6px solid var(--bad); border-radius:12px;
    color:var(--bad); background:rgba(10,20,40,.9);
    font-size:56px; font-weight:800; letter-spacing:6px; text-transform:uppercase;
    transform:rotate(-12deg); animation:stampIn .55s cubic-bezier(.2,1.35,.4,1) both;
    pointer-events:none;
  }
  .stamp.ok{ color:var(--ok); border-color:var(--ok); }

  /* Fragmentos resaltados dentro de un mensaje */
  .hl{
    background:rgba(255,77,77,.18); border-bottom:4px solid var(--bad);

  }

    display:inline-flex; align-items:center; justify-content:center;

  .zbadge{

  }

  .strength i{ transition:width 1.1s cubic-bezier(.2,.8,.3,1); }

  .hack-a{ padding:0 40px; gap:24px; }

  .hack-actions{ display:flex; gap:26px; width:100%; max-width:1680px; }

  }

  function shuffle(list) {
    var a = list.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function later(ms, fn) {
    var id = setTimeout(function () {
      state.timers = state.timers.filter(function (x) { return x !== id; });
      fn();
    }, ms);
    state.timers.push(id);
    return id;
  }

  function clearLater() {
    state.timers.forEach(clearTimeout);
    state.timers = [];
  }

    state.lock = (window.performance ? performance.now() : Date.now()) + (ms || 400);

    var now = window.performance ? performance.now() : Date.now();
    return now < state.lock;

  /* Sonido opcional (sin archivos externos) */
  var audioCtx = null;
  function beep(freq, dur, type, vol) {
    if (!state.sound) return;
    try {
      if (!audioCtx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        audioCtx = new AC();
      }
      var osc = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      osc.type = type || "sine";
      osc.frequency.value = freq;
      g.gain.value = vol || 0.05;
      osc.connect(g);
      g.connect(audioCtx.destination);
      var t = audioCtx.currentTime;
      osc.start(t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.stop(t + dur);
    } catch (e) { /* sin sonido, la página sigue igual */ }
  }

  var STORE_KEY = "gie_contador_v1";

  function hoy() {
    var d = new Date();
    return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
  }

  function cargaContador() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return;
      var o = JSON.parse(raw);
      if (o && o.dia === hoy()) {
        state.counters.p = o.p || 0;
        state.counters.a = o.a || 0;
      }
    } catch (e) { /* localStorage puede fallar */ }
    pintaContador();
  }

  function guardaContador() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        dia: hoy(), p: state.counters.p, a: state.counters.a
      }));
    } catch (e) { /* sigue funcionando */ }
  }

  function construyeRuleta() {
    var stops = [];
    var labels = [];
    for (var i = 0; i < CASILLAS.length; i++) {
      var c = CASILLAS[i];
      stops.push(c.color + " " + (i * 60) + "deg " + ((i + 1) * 60) + "deg");
      labels.push(
        '<div class="lbl" style="transform:rotate(' + (i * 60 + 30) + 'deg)">' +
          '<div class="lbl-in" style="color:#fff">' + ICON[c.icono] + c.corto + '</div>' +
        '</div>'
      );
    }
    wheel.style.background = "conic-gradient(" + stops.join(",") + ")";
    wheel.innerHTML = labels.join("");
  }

  /* ============================================================

     ============================================================ */
  function pickCasilla() {
    var idx = Math.floor(Math.random() * CASILLAS.length);
    if (idx === state.lastCasilla) {
      idx = (idx + 1 + Math.floor(Math.random() * (CASILLAS.length - 1))) % CASILLAS.length;
    }
    state.lastCasilla = idx;
    return idx;
  }

  function spin() {
    if (state.mode !== "idle" || locked()) return;
    setLock();
    state.lastAction = Date.now();
    state.mode = "spinning";

    var idx = pickCasilla();
    state.casilla = idx;

    var base = Math.ceil(state.rot / 360) * 360;
    var jitter = (Math.random() - 0.5) * 40;
    state.rot = base + 360 * 5 + (360 - (idx * 60 + 30)) + jitter;

    wheel.style.transition = "transform 3.8s cubic-bezier(.12,.7,.15,1)";
    wheel.style.transform = "rotate(" + state.rot + "deg)";
    beep(300, 0.05, "square", 0.03);

    later(4300, function () {
      if (state.mode === "spinning") revealCasilla();
    });
  }

  function revealCasilla() {
    if (state.mode !== "spinning") return;
    state.mode = "reveal";
    var c = CASILLAS[state.casilla];
    revealName.textContent = c.nombre.toUpperCase();
    revealName.style.color = c.color;
    revealIcon.innerHTML = ICON[c.icono];
    revealIcon.style.color = c.color;
    reveal.classList.add("show");
    beep(660, 0.12, "sine", 0.06);

    later(1600, function () {
      reveal.classList.remove("show");
      if (state.casilla === 5) startHack();
      else startChallenge();
    });
  }

  function siguienteReto(id) {
    if (!state.decks[id] || state.decks[id].length === 0) {
      var deck = shuffle(RETOS[id].map(function (_, i) { return i; }));
      // Al rebarajar, evita que salga primero el mismo reto que se acaba de ver.
      if (deck.length > 1 && state.lastReto[id] === deck[deck.length - 1]) {
        var t = deck[deck.length - 1];
        deck[deck.length - 1] = deck[0];
        deck[0] = t;
      }
      state.decks[id] = deck;
    }
    var idx = state.decks[id].pop();
    state.lastReto[id] = idx;
    return idx;
  }

  /* ============================================================
     CRONÓMETRO
     ============================================================ */
  function startTimer(segundos, onEnd, rootId) {
    stopTimer();
    var root = el(rootId || "timer");
    if (!root) return;
    var fill = root.querySelector(".timer-fill");
    var num = root.querySelector(".timer-num");
    if (!fill || !num) return;

    var total = segundos * 1000;
    var t0 = (window.performance ? performance.now() : Date.now());
    var ultimo = -1;
    state.timerOn = true;
    state.timerRoot = root;

    function step(now) {
      if (!state.timerOn) return;
      var left = Math.max(0, total - (now - t0));
      fill.style.width = ((left / total) * 100) + "%";
      var s = Math.ceil(left / 1000);
      if (s !== ultimo) { num.textContent = s; ultimo = s; }
      root.classList.toggle("warn", left <= 7000 && left > 3000);
      root.classList.toggle("danger", left <= 3000);
      if (left <= 0) {
        state.timerOn = false;
        onEnd();
        return;
      }
      state.raf = requestAnimationFrame(step);
    }
    state.raf = requestAnimationFrame(step);
  }

  function stopTimer() {
    state.timerOn = false;
    if (state.raf) cancelAnimationFrame(state.raf);
    state.raf = 0;
    if (state.timerRoot) {
      state.timerRoot.classList.remove("warn", "danger");
      state.timerRoot = null;
    }
  }

  function aplicaResaltes(texto, campo, resaltes, modo) {
    if (modo !== "result" || !resaltes) return texto;
    var marcas = [];
    for (var i = 0; i < resaltes.length; i++) {
      var m = resaltes[i];
      if (m.c !== campo) continue;
      var pos = texto.indexOf(m.t);
      if (pos >= 0) marcas.push({ pos: pos, len: m.t.length, n: i + 1 });
    }
    if (!marcas.length) return texto;
    marcas.sort(function (a, b) { return a.pos - b.pos; });

    var out = "";
    var cursor = 0;
    for (var j = 0; j < marcas.length; j++) {
      var k = marcas[j];
      if (k.pos < cursor) continue;
      out += texto.slice(cursor, k.pos);
      out += '<span class="hl">' + texto.slice(k.pos, k.pos + k.len) + '<b>' + k.n + '</b></span>';
      cursor = k.pos + k.len;
    }
    return out + texto.slice(cursor);
  }

  function tarjetaMensaje(r, modo) {
    var campo = function (nombre) {
      return aplicaResaltes(r[nombre] || "", nombre, r.resaltes, modo);

    if (modo === "result") {
      var esReal = r.correcta === "real";
      sello = '<span class="stamp' + (esReal ? " ok" : "") + '">' + (esReal ? "REAL" : "FRAUDE") + '</span>';
    }
    var head = "";

    if (r.formato === "correo") {
      head =
        '<div class="msg-head">' +
          '<span class="chip">' + (r.chip || "Correo electrónico") + '</span>' +
          '<div class="msg-line"><span class="k">De</span><span>' + campo("de") + '</span></div>' +
          '<div class="msg-line"><span class="k">Asunto</span><span>' + campo("asunto") + '</span></div>' +
        '</div>' +
        '<div class="msg-body">' + campo("cuerpo") + '</div>';
    } else {
      head =
        '<div class="msg-head"><span class="chip">' + (r.chip || r.formato) + '</span>' +
          '<div class="msg-line"><span>' + campo("de") + '</span></div>' +
        '</div>' +
        '<div class="msg-body bubble">' + campo("cuerpo") + '</div>';
    }
    return '<div class="msg-wrap"><div class="' + cls + '">' + head + '</div>' + sello + '</div>';
  }

  function tarjetaAlerta(r, modo, elegida) {
    var n = 0;
    var zonas = r.zonas.map(function (z, i) {
      var cls = "zone";
      var badge = "";
      if (modo === "result") {
        if (z.esSenal) {
          n += 1;
          cls += " is-senal";
          badge = '<span class="zbadge">' + n + '</span>';
        }
        if (i === elegida) {
          cls += z.esSenal ? " picked-ok" : " picked-bad";
          if (!z.esSenal) badge = '<span class="zbadge">✗</span>';
          badge += '<span class="you">TÚ</span>';
        }
      }
      return '<button class="' + cls + '" data-z="' + i + '"' +
        (modo === "result" ? " disabled" : "") + '>' +
        '<span class="zk">' + z.k + '</span>' +
        '<span class="zt">' + z.t + '</span>' +
        badge +
      '</button>';
    }).join("");

    return '<div class="msg' + (modo === "result" ? " compact" : "") + '" style="max-width:1560px">' +
      '<div class="msg-head"><span class="chip">Correo · haz clic en lo sospechoso</span></div>' +
      '<div class="zones">' + zonas + '</div>' +
    '</div>';
  }

  /* ============================================================
     RESULTADO
     ============================================================ */
  function responder(acierto) {
    if (locked()) return;
    if (state.mode !== "challenge") return;
    stopTimer();

    state.mode = "result";
    state.lastCorrect = acierto;
    state.ronda.hechos += 1;
    if (acierto) state.ronda.aciertos += 1;
    setLock(400);
    if (acierto) beep(880, 0.14, "sine", 0.06);
    else beep(220, 0.2, "triangle", 0.06);

    renderResultado(acierto);
    showScreen("screen-result");
  }

  function bannerHTML(acierto) {
    if (acierto) {
      return '<div class="banner ok">' + ICON.check + ' ¡Correcto!</div>';
    }
    return '<div class="banner bad">' + ICON.x + ' Casi. Mira por qué:</div>';
  }

  function accionesHTML() {
    var ultimo = state.ronda.hechos >= state.ronda.total;
    var texto = ultimo ? "VER RESULTADO" : "SIGUIENTE";
    return '<div class="actions">' +
      '<button class="btn solid" id="btn-next">' + texto + ' ' + ICON.next + '</button>' +
    '</div>';
  }

  function siguientePaso() {
    if (state.mode !== "result") return;
    if (state.ronda.hechos >= state.ronda.total) showPrize();
    else startChallenge();
  }

  function finalizaResultado() {
    var next = el("btn-next");
    if (!next) return;
    next.addEventListener("click", function () {
      if (locked()) return;
      siguientePaso();
    });
  }

  function iconoAtaque(nombre) {
    var mapa = {
      "phishing": "hook",
      "ransomware": "lock",
      "fuerza bruta": "key",
      "suplantación": "user",
      "malware": "skull",
      "red pública": "wifi"
    };
    var k = nombre.toLowerCase();
    for (var clave in mapa) {
      if (k.indexOf(clave) >= 0) return ICON[mapa[clave]];
    }
    return ICON.lupa;
  }

  function renderResultado(acierto) {
    var c = CASILLAS[state.casilla];
    var r = state.reto;
    var body = el("res-body");

    el("res-head").innerHTML = headHTML(c, true);
    el("res-banner").innerHTML = bannerHTML(acierto);

    if (c.id === "real_fraude") {
      var lista = r.senales.map(function (s, i) {
        return '<div class="sig ' + (r.correcta === "real" ? "real" : "") + '">' +
          '<span class="n">' + (i + 1) + '</span><span>' + s + '</span></div>';
      }).join("");
      body.innerHTML =
        tarjetaMensaje(r, "result") +
        '<div class="signals">' + lista + '</div>' +
        accionesHTML();
    }

    else if (c.id === "alerta") {
      var elegida = state.result ? state.result.zona : -1;
      var n = 0;
      var motivos = r.zonas.map(function (z) {
        if (!z.esSenal) return "";
        n += 1;
        return '<div class="sig"><span class="n">' + n + '</span><span><b>' + z.k + ':</b> ' + z.motivo + '</span></div>';
      }).join("");
      var nota = "";
      if (elegida >= 0 && !r.zonas[elegida].esSenal) {
        nota = '<div class="sig"><span class="n">✗</span><span><b>Pulsaste «' +
          r.zonas[elegida].k + '»:</b> ' + r.zonas[elegida].motivo + '. Era una parte normal.</span></div>';
      }
      body.innerHTML =
        '<div class="res-grid">' +
          tarjetaAlerta(r, "result", elegida) +
          '<div class="signals">' + motivos + nota + '</div>' +
        '</div>' +
        accionesHTML();
    }

    else if (c.id === "password") {
      var elegidoP = state.result ? state.result.indice : -1;
      var tarjetas = state.vista.map(function (v, i) {
        var cls = "pcard";
        if (v.correct) cls += " right";
        else if (i === elegidoP) cls += " wrong";
        var h = fuerza(v.tiempo);
        return '<div class="' + cls + '">' +
          '<span class="letter">' + ["A", "B", "C"][i] + '</span>' +
          (v.correct ? '<span class="tag">✓ La más segura</span>' : "") +
          '<span class="pass">' + v.texto + '</span>' +
          '<div class="strength"><i class="s-' + h.cls + '" data-pct="' + h.pct + '" style="width:0%"></i></div>' +
          '<div class="ptime">Tiempo estimado para descifrarla<b>' + v.tiempo + '</b></div>' +
        '</div>';
      }).join("");
      body.innerHTML =
        '<div class="pcards">' + tarjetas + '</div>' +
        '<div class="explain">' + r.explicacion + '</div>' +
        accionesHTML();

      // La barra de fortaleza se llena al aparecer, como un descifrado.
      var barras = body.querySelectorAll(".strength i");
      for (var bi = 0; bi < barras.length; bi++) {
        (function (barra, delay) {
          later(160 + delay, function () {
            barra.style.width = barra.getAttribute("data-pct") + "%";
          });
        })(barras[bi], bi * 170);
      }
    }

    else if (c.id === "ataque") {
      var elegidoA = state.result ? state.result.indice : -1;
      var opciones = state.vista.map(function (v, i) {
        var cls = "btn";
        if (v.correct) cls += " ok";
        else if (i === elegidoA) cls += " bad";
        return '<div class="' + cls + '" style="cursor:default">' + iconoAtaque(v.texto) + v.texto + '</div>';
      }).join("");
      body.innerHTML =
        '<div class="situation">' + ICON.lupa + '<span>' + r.situacion + '</span></div>' +
        '<div class="answers three">' + opciones + '</div>' +
        '<div class="definition">' +
          '<h2>' + r.opciones[r.correcta] + '</h2>' +
          '<p>' + r.definicion + '</p>' +
          '<p class="prot"><b>Cómo protegerte:</b> ' + r.proteccion + '</p>' +
        '</div>' +
        accionesHTML();
    }

    else if (c.id === "que_harias") {
      var elegidoQ = state.result ? state.result.indice : -1;
      var opcionesQ = state.vista.map(function (v, i) {
        var cls = "btn";
        if (v.correct) cls += " ok";
        else if (i === elegidoQ) cls += " bad";
        return '<div class="' + cls + '" style="cursor:default">' + v.texto + '</div>';
      }).join("");
      var tocada = elegidoQ >= 0 ? state.vista[elegidoQ] : null;
      var notaQ = (tocada && !tocada.correct && tocada.fallo)
        ? '<div class="q-line" style="color:#FFB3B3"><b>Lo que elegiste:</b> ' + tocada.fallo + '</div>'
        : "";
      body.innerHTML =
        '<div class="q-summary">' + r.situacion + '</div>' +
        '<div class="answers three">' + opcionesQ + '</div>' +
        notaQ +
        '<div class="q-line"><b>La acción segura:</b> ' + r.explicacion + '</div>' +
        accionesHTML();
    }

    finalizaResultado();
  }

  function fuerza(tiempo) {
    if (/instante/i.test(tiempo)) return { pct: 6, cls: "bad" };
    if (/horas/i.test(tiempo)) return { pct: 45, cls: "warn" };
    return { pct: 100, cls: "ok" };
  }

  /* ============================================================
     ¡HACKEADO!
     ============================================================ */
  function startHack() {
    state.mode = "hack";
    state.result = null;
    state.lastCorrect = null;
    state.hackElegido = -1;
    state.hackTimeout = false;
    stage.classList.add("hacked");

    var h = HACKS[Math.floor(Math.random() * HACKS.length)];
    state.hack = h;
    state.hackVista = shuffle(h.opciones.map(function (o) {
      return { t: o.t, ok: !!o.ok, fallo: o.fallo || "" };
    }));

    renderHackAlarma();
  }

  function renderHackAlarma() {
    var h = state.hack;
    var scr = el("screen-hack");
    var botones = state.hackVista.map(function (o, i) {
      return '<button class="btn" data-h="' + i + '">' + o.t + '</button>';
    }).join("");

    scr.innerHTML =
      '<div class="hack-a shake">' +
        '<h1>' + h.titulo + '</h1>' +
        '<div class="sub">' + h.sub + '</div>' +
        '<div class="pct" style="color:#FF9C9C;font-size:40px">' + h.pregunta + '</div>' +
        '<div class="hack-actions">' + botones + '</div>' +
        '<div class="timer" id="hack-timer">' +
          '<div class="timer-bar"><div class="timer-fill"></div></div>' +
          '<div class="timer-num">8</div>' +
        '</div>' +
      '</div>';

    var btns = scr.querySelectorAll("[data-h]");
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", function () {
        var k = parseInt(this.getAttribute("data-h"), 10);
        hackResponder(!!state.hackVista[k].ok, false, k);
      });
    }

    showScreen("screen-hack");
    setLock(300);
    startTimer(8, function () {
      if (state.mode === "hack") hackResponder(false, true, -1);
    }, "hack-timer");
  }

  function hackResponder(ok, tiempoAgotado, elegido) {
    if (locked()) return;
    if (state.mode !== "hack") return;
    stopTimer();

    state.mode = "hack-result";
    state.lastCorrect = ok;
    state.ronda = { total: 1, hechos: 1, aciertos: ok ? 1 : 0 };
    state.hackElegido = elegido;
    state.hackTimeout = !!tiempoAgotado;
    if (ok) beep(880, 0.14, "sine", 0.06);
    else beep(170, 0.25, "triangle", 0.06);

    later(400, function () {
      if (state.mode === "hack-result") renderHackExplicacion();
    });
  }

  function renderHackExplicacion() {
    var h = state.hack;
    var ok = !!state.lastCorrect;
    var elegido = state.hackElegido;

    var banner = ok
      ? '<div class="banner ok">' + ICON.check + ' ¡Bien! No caíste</div>'
      : (state.hackTimeout
        ? '<div class="banner warn">' + ICON.clock + ' Se acabó el tiempo. Mira lo que pasaba:</div>'
        : '<div class="banner bad">' + ICON.x + ' Caíste en la trampa</div>');

    var fallo = "";
    if (!ok && elegido >= 0) {
      fallo = '<p class="intro" style="color:#FFB3B3"><b>Lo que elegiste:</b> «' +
        state.hackVista[elegido].t + '». ' + state.hackVista[elegido].fallo + '</p>';
    }

    var buena = null;
    for (var bi = 0; bi < state.hackVista.length; bi++) {
      if (state.hackVista[bi].ok) { buena = state.hackVista[bi]; break; }
    }
    var acierto = buena
      ? '<p class="intro" style="color:#8CF3B4"><b>La decisión segura era:</b> «' + buena.t + '».</p>'
      : "";

    var consejos = h.consejos.map(function (t, i) {
      return '<div class="tip-card"><span class="n">' + (i + 1) + '</span><span>' + t + '</span></div>';
    }).join("");

    el("screen-hack").innerHTML =
      '<div class="hack-c">' +
        banner +
        '<p class="atk">' + h.ataque + '</p>' +
        '<p class="intro">' + h.intro + '</p>' +
        acierto +
        fallo +
        '<div class="tips">' + consejos + '</div>' +
        '<div style="display:flex;justify-content:center;padding-top:6px">' +
          '<button class="btn solid" id="btn-hack-next">SIGUIENTE ' + ICON.next + '</button>' +
        '</div>' +
      '</div>';

    el("btn-hack-next").addEventListener("click", function () {
      if (locked()) return;
      showPrize();
    });
  }

  /* ============================================================
     PREMIO
     ============================================================ */
  function showPrize() {
    if (state.mode === "prize") return;
    clearLater();
    stopTimer();
    state.mode = "prize";
    stage.classList.remove("hacked");

    state.counters.p += 1;
    state.counters.a += state.ronda.aciertos;
    guardaContador();
    pintaContador();

    var nh = state.ronda.aciertos;
    var nt = state.ronda.total;
    var titulo;
    if (nt > 1) {
      if (nh === nt) titulo = "¡Perfecto! No caíste en ninguna.";
      else if (nh >= nt - 1) titulo = "Buen ojo. Casi perfecto.";
      else if (nh === 0) titulo = "Nadie es inmune.";
      else if (nh === 1) titulo = "Un descuido basta.";
      else titulo = "Buen ojo.";
    } else {
      titulo = state.lastCorrect ? "¡Bien! No caíste." : "Así actúa el engaño.";
    }
    var sub = nt > 1 ? '<p class="sub">Acertaste ' + nh + ' de ' + nt + '</p>' : "";

    var tip = TIPS[Math.floor(Math.random() * TIPS.length)];
    el("prize-content").innerHTML =
      '<div class="prize-icon">' + ICON.shield + '</div>' +
      '<h2>' + titulo + '</h2>' +
      sub +
      '<div class="tip"><span class="lbl2">Consejo del día</span>' + tip + '</div>' +
      '<button class="btn solid" id="btn-again">VOLVER A GIRAR</button>';

    showScreen("screen-prize");
    beep(990, 0.16, "sine", 0.05);

    el("btn-again").addEventListener("click", function () {
      if (locked()) return;
      resetAll();
    });

    later(15000, function () {
      if (state.mode === "prize") resetAll();
    });
  }

  /* ============================================================
     REINICIO
     ============================================================ */
  function resetAll() {
    clearLater();
    stopTimer();
    state.mode = "idle";
    state.casilla = null;
    state.reto = null;
    state.vista = null;
    state.result = null;
    state.lastCorrect = null;
    state.hack = null;
    state.hackVista = null;
    state.hackElegido = -1;
    state.hackTimeout = false;
    state.ronda = { total: 0, hechos: 0, aciertos: 0 };
    state.lastAction = Date.now();
    reveal.classList.remove("show");
    stage.classList.remove("hacked");
    el("screen-hack").innerHTML = "";

    wheel.style.transition = "none";
    wheel.style.transform = "rotate(0deg)";
    state.rot = 0;
    // fuerza reflujo para que el siguiente giro sí anime
    void wheel.offsetWidth;

    showScreen("screen-wheel");
    setLock(400);
  }

  /* ============================================================
     CONTROLES DE OPERADOR
     ============================================================ */
  function toggleOperator() {
    el("operator").classList.toggle("show");
  }

  function skipState() {
    if (state.mode === "idle") { spin(); return; }
    if (state.mode === "spinning" || state.mode === "reveal") {
      reveal.classList.remove("show");
      if (state.casilla === 5) startHack();
      else startChallenge();
      return;
    }
    if (state.mode === "challenge") { responder(false); return; }
    if (state.mode === "result") { siguientePaso(); return; }
    if (state.mode === "prize") { resetAll(); return; }
    if (state.mode === "hack" || state.mode === "hack-result") { showPrize(); }
  }

  document.addEventListener("keydown", function (e) {
    var k = e.key.toLowerCase();
    state.lastAction = Date.now();
    if (k === "r" || e.key === "Escape") { resetAll(); e.preventDefault(); return; }
    if (k === "m") {
      state.sound = !state.sound;
      beep(520, 0.1, "sine", 0.05);
      return;
    }
    if (k === "n") { skipState(); return; }
    if (k === "o") { toggleOperator(); return; }
  });

  el("op-reset").addEventListener("click", function () {
    state.counters = { p: 0, a: 0 };
    guardaContador();
    pintaContador();
  });

  /* Bloqueo de menú contextual, selección y arrastre */
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  document.addEventListener("dragstart", function (e) { e.preventDefault(); });

  /* Ocultar el cursor tras 5 s sin movimiento */
  var cursorTimer = null;
  function despiertaCursor() {
    document.body.classList.remove("nocursor");
    state.lastAction = Date.now();
    clearTimeout(cursorTimer);
    cursorTimer = setTimeout(function () {
      document.body.classList.add("nocursor");
    }, 5000);
  }
  document.addEventListener("mousemove", despiertaCursor);
  document.addEventListener("mousedown", despiertaCursor);
  despiertaCursor();

  /* Inactividad: la explicación avanza sola; el resto vuelve a S0 */
  setInterval(function () {
    var quieto = Date.now() - state.lastAction;
    if (state.mode === "result" && quieto > 20000) {
      siguientePaso();
      return;
    }
    if (state.mode === "hack-result" && quieto > 20000) {
      showPrize();
      return;
    }
    if (state.mode !== "idle" && quieto > 60000) resetAll();
  }, 1000);

  document.addEventListener("mousedown", function () { state.lastAction = Date.now(); });

  /* Error fatal: mensaje y recarga */
  window.addEventListener("error", function () {
    var f = el("fatal");
    if (f) {
      f.classList.add("show");
      setTimeout(function () { location.reload(); }, 3000);
    }
  });

  /* ============================================================
     ARRANQUE
     ============================================================ */
  function fit() {
    var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = "translate(-50%,-50%) scale(" + s + ")";
  }
  window.addEventListener("resize", fit);
  fit();

  construyeRuleta();
  cargaContador();
  pintaContador();

  el("hub").addEventListener("click", spin);
  el("btn-spin").addEventListener("click", spin);

  // El clic sobre la ruleta también gira
  wheel.addEventListener("click", spin);
})();
</script>
</body>
</html>
